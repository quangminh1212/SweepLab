name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force -Scope CurrentUser
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: Analyze module source
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings) { throw "$($findings.Count) PSScriptAnalyzer finding(s) in ./src." }

      - name: Analyze scripts
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings) { throw "$($findings.Count) PSScriptAnalyzer finding(s) in ./scripts." }

  test:
    name: Pester
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester for PowerShell 7
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run test suite on PowerShell 7
        shell: pwsh
        run: ./scripts/ci/Invoke-SweepLabTests.ps1 -Path ./tests -Verbosity Detailed

      - name: Install Pester for Windows PowerShell
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run test suite on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/ci/Invoke-SweepLabTests.ps1 -Path ./tests -Verbosity Detailed
