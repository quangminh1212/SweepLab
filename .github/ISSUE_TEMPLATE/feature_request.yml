name: Feature request
description: A new cleanup target, a new category, or a change in behaviour.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please read [docs/safety.md](https://github.com/quangminh1212/SweepLab/blob/main/docs/safety.md) first:
        targets that can break repair, uninstall or boot are out of scope by design.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to reclaim, and what does SweepLab currently miss?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed target or behaviour
      description: Include the exact path, or the folder name and the marker file that proves what it is.
      placeholder: |
        Path: %LOCALAPPDATA%\SomeApp\Cache
        Category: app-cache
        Regenerated by: the app on next start
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Why it is safe to delete
      description: What recreates it, and what breaks if it is missing?
    validations:
      required: true

  - type: dropdown
    id: elevation
    attributes:
      label: Does the path require elevation?
      options:
        - 'No'
        - 'Yes'
        - 'Not sure'
    validations:
      required: true
