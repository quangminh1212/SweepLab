# SweepLab has no runtime dependencies; the only things worth updating are the
# workflow actions, which are pinned to a moving major version on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
